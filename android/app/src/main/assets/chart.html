<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body, #chart { margin: 0; width: 100%; height: 100%; }
  </style>
  <script src="plotly.min.js"></script>
</head>
<body>
  <div id="chart"></div>
  <script>
    function render(figure) {
      // Fill the screen, unless the chart asked for a set height (panels need room to scroll)
      figure.layout.autosize = !figure.layout.height;
      document.body.style.background = figure.layout.paper_bgcolor;
      Plotly.react("chart", figure.data, figure.layout, {
        responsive: true,
        displaylogo: false,
        displayModeBar: figure.data[0].type !== "pie",
        modeBarButtons: [["zoomIn2d", "zoomOut2d", "resetScale2d"]],
      });
    }
  </script>
</body>
</html>
