[project]
name = "dataviz"
version = "0.1.0"
description = "Enter or upload data and get interactive charts, cleaning and insights."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (undefined names, unused imports), I: import order, B: likely bugs
select = ["E", "W", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
